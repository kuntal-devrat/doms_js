[workspace]
resolver = "2"
members = [
    "crates/doms_gc",
    "crates/doms_parser",
    "crates/doms_compiler",
    "crates/doms_vm",
    "crates/doms_parallel",
    "crates/doms_core",
    "crates/doms_ffi",
    "crates/doms_cli",
    "fuzz",
    "crates/doms_wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kuntal-devrat/doms_js"
homepage = "https://domsjs.dev"
description = "A modular, embeddable JavaScript engine with first-class parallelism support"
categories = ["compilers", "wasm", "web-programming"]
keywords = ["javascript", "engine", "embeddable", "parallel", "ecmascript"]

[workspace.dependencies]
# Internal crates
doms_gc = { path = "crates/doms_gc" }
doms_parser = { path = "crates/doms_parser" }
doms_compiler = { path = "crates/doms_compiler" }
doms_vm = { path = "crates/doms_vm" }
doms_parallel = { path = "crates/doms_parallel" }
doms_core = { path = "crates/doms_core" }
doms_ffi = { path = "crates/doms_ffi" }
doms_cli = { path = "crates/doms_cli" }
doms_wasm = { path = "crates/doms_wasm" }

# External dependencies
thiserror = "2"
log = "0.4"
libc = "0.2"
unicode-ident = "1.0"
num-bigint = "0.4.8"
num-traits = "0.2.19"
regress = "0.12"
cranelift-codegen = "0.137.0-rc.1"
cranelift-frontend = "0.137.0-rc.1"
cranelift-jit = "0.137.0-rc.1"
cranelift-module = "0.137.0-rc.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = 1
strip = false
