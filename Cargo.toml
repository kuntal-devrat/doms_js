[workspace]
resolver = "2"
members = [
    "crates/doms_gc",
    "crates/doms_parser",
    "crates/doms_compiler",
    "crates/doms_vm",
    "crates/doms_parallel",
    "crates/doms_core",
    "crates/doms_ffi",
    "crates/doms_cli",
    "fuzz",
    "crates/doms_wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
doms_gc = { path = "crates/doms_gc" }
doms_parser = { path = "crates/doms_parser" }
doms_compiler = { path = "crates/doms_compiler" }
doms_vm = { path = "crates/doms_vm" }
doms_parallel = { path = "crates/doms_parallel" }
doms_core = { path = "crates/doms_core" }

# External dependencies
thiserror = "2"
log = "0.4"
libc = "0.2"
unicode-ident = "1.0"
num-bigint = "0.4.8"
num-traits = "0.2.19"
regress = "0.12"
cranelift-codegen = "0.137.0-rc.1"
cranelift-frontend = "0.137.0-rc.1"
cranelift-jit = "0.137.0-rc.1"
cranelift-module = "0.137.0-rc.1"
cranelift-native = "0.137.0-rc.1"
sha2 = "0.11"
getrandom = "0.4"
ureq = "3.4"

[profile.release]
opt-level = 2
lto = "off"
codegen-units = 1
panic = "unwind"
debug = false
strip = true

[profile.test.package.doms_vm]
opt-level = 2


